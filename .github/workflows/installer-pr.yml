name: Portable installer PR checks

on:
  pull_request:
    branches: [main]
    paths:
      - "wrapper/**"
      - "tools/linux/build_wrapper.sh"
      - ".github/workflows/installer-pr.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python syntax, native UI and portable tests
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install PySide6==6.10.0 certifi cryptography==46.0.4
      - name: Check Python syntax
        run: python -m compileall -q wrapper
      - name: Run offline portable installer tests
        run: python -m unittest discover -s wrapper/tests -v
      - name: Check build script syntax
        run: bash -n tools/linux/build_wrapper.sh
