name: Portable installer PR checks

on:
  pull_request:
    branches: [main]
    paths:
      - "wrapper/**"
      - "tools/linux/build_wrapper.sh"
      - "tools/linux/build_wrapper_builder.sh"
      - ".github/workflows/installer-pr.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-installer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python syntax, native UI and portable tests
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install PySide6==6.10.0 certifi cryptography==46.0.4
      - name: Check Python syntax
        run: python -m compileall -q wrapper
      - name: Run offline portable installer tests
        run: python -m unittest discover -s wrapper/tests -v
      - name: Check build script syntax
        run: bash -n tools/linux/build_wrapper.sh tools/linux/build_wrapper_builder.sh

  package:
    name: Build portable AppImage preview with bundled compiler
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install AppImage packaging dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git gcc make libmbedtls-dev patchelf libegl1 libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxcb-shape0 libxcb-util1
      - name: Install Qt and extraction tooling
        run: python -m pip install PySide6==6.10.0 pyinstaller==6.22.3 cryptography==46.0.4 "certifi>=2025.1.31"
      - name: Prepare complete offline source compiler
        run: bash tools/linux/build_wrapper_builder.sh x86_64
      - name: Build standalone launcher AppImage
        run: bash tools/linux/build_wrapper.sh x86_64
      - name: Inspect AppImage contents
        run: |
          cd build/dist
          chmod +x SavageWind-Portable-x86_64.AppImage
          ./SavageWind-Portable-x86_64.AppImage --appimage-extract >/dev/null
          test -s squashfs-root/usr/share/wrapper/pr_build.py
          test -s squashfs-root/usr/share/wrapper/i18n.py
          test -x squashfs-root/usr/bin/swqt/swqt
          test -x squashfs-root/usr/bin/bwrap
          test -x squashfs-root/usr/share/savagewind-builder/rootfs/usr/bin/clang
          test -x squashfs-root/usr/share/savagewind-builder/rootfs/usr/bin/git
          test -x squashfs-root/usr/share/savagewind-builder/seed/build/zig/zig
          test -s squashfs-root/usr/share/savagewind-builder/upstream-commit

      - name: Smoke test embedded compiler in CI-compatible sandbox
        run: |
          # The GitHub-hosted runner blocks CAP_NET_ADMIN and bubblewrap's
          # --unshare-net loopback initialization (RTM_NEWADDR EPERM).
          # This executes ONLY bundled tool version commands with the CI
          # network namespace shared; player builds still require --unshare-net.
          cd build/dist
          mkdir -p test-source
          export SAVAGEWIND_BUILDER_ROOT="$PWD/squashfs-root/usr/share/savagewind-builder"
          export SAVAGEWIND_BWRAP="$PWD/squashfs-root/usr/bin/bwrap"
          PYTHONPATH="$PWD/squashfs-root/usr/share" python - <<'PY'
          import subprocess
          from pathlib import Path
          from wrapper.pr_build import bundled_builder, sandbox_command
          rootfs, _, runner = bundled_builder()
          source = Path.cwd() / "test-source"
          assert "--unshare-net" in sandbox_command(rootfs, runner, source,
                                                     ["clang", "--version"])
          for command_name, version_arg, expected in (
              ("clang", "--version", "clang version 21"),
              ("git", "--version", "git version"),
          ):
              # Only the CI smoke test shares the runner's network namespace.
              # No untrusted source or build scripts execute in this step.
              command = sandbox_command(rootfs, runner, source,
                                        [command_name, version_arg], network=True)
              assert "--unshare-net" not in command
              result = subprocess.run(command, capture_output=True, text=True, timeout=30)
              print(result.stdout)
              print(result.stderr)
              assert result.returncode == 0, f"Bundled {command_name} cannot start"
              assert expected in result.stdout
          PY

          squashfs-root/usr/bin/swqt/swqt --root "$PWD" --selftest
      - uses: actions/upload-artifact@v4
        with:
          name: SavageWind-Portable-PR-preview
          path: build/dist/SavageWind-Portable-x86_64.AppImage
          if-no-files-found: error
