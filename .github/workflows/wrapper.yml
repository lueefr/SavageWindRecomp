name: Portable AppImage releases

# Only relevant portable-launcher or packaging changes on main can publish.
# README, changelog, documentation, tests and unrelated upstream edits are ignored.
on:
  push:
    branches: [main]
    paths:
      - "wrapper/**"
      - "!wrapper/tests/**"
      - "!wrapper/**/*.md"
      - "!wrapper/**/*.rst"
      - "!wrapper/**/*.txt"
      - "tools/linux/build_wrapper.sh"
      - "tools/linux/wrapper_AppRun"
      - "tools/linux/wrapper.desktop"
      - "tools/linux/import_game.py"
      - "tools/linux/nsp_vendor/**"
      - "!tools/linux/nsp_vendor/**/*.md"
      - "!tools/linux/nsp_vendor/**/README*"
      - "!tools/linux/nsp_vendor/**/CHANGELOG*"
      - "!tools/linux/nsp_vendor/**/LICENSE*"
      - "tools/build_hactool.py"
      - "tools/hactool/**"
      - "!tools/hactool/**/*.md"
      - "!tools/hactool/**/README*"
      - "!tools/hactool/**/CHANGELOG*"
      - "!tools/hactool/**/LICENSE*"
      - "docs/icon/icon_1024.png"
      - "tools/linux/portable_release.py"
      - ".github/workflows/wrapper.yml"

permissions:
  contents: read

# Don't cancel a release midway through publishing when main receives a new push.
concurrency:
  group: portable-appimage-main
  cancel-in-progress: false

jobs:
  plan:
    name: Verify wrapper changes and choose version
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check actual changes since previous portable release
        id: version
        run: python3 tools/linux/portable_release.py plan --output "$GITHUB_OUTPUT"

  tests:
    name: Portable wrapper tests
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Syntax and unit tests
        run: |
          python -m compileall -q wrapper tools/linux/portable_release.py
          python -m unittest discover -s wrapper/tests -v
          python -m pip install cryptography==46.0.4
          PYTHONPATH=tools/linux python tools/linux/test_import_game.py
          python tools/linux/test_portable_release.py
          sh -n tools/linux/wrapper_AppRun
          bash -n tools/linux/build_wrapper.sh

  appimage:
    name: Build and publish versioned AppImage
    needs: [plan, tests]
    if: needs.plan.outputs.release == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git gcc make libmbedtls-dev patchelf libegl1 libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxcb-shape0 libxcb-util1
      - name: Install Qt/AppImage builder
        run: python -m pip install PySide6==6.10.0 pyinstaller==6.22.3 cryptography==46.0.4 "certifi>=2025.1.31"
      - name: Verify Qt never maps the installer during an unchanged launch
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest wrapper.tests.test_qt_visibility -v
      - name: Build portable AppImage
        env:
          QT_QPA_PLATFORM: offscreen
        run: bash tools/linux/build_wrapper.sh x86_64
      - name: Verify portable AppImage layout
        run: |
          set -euo pipefail
          cd build/dist
          chmod +x SavageWind-Portable-x86_64.AppImage
          ./SavageWind-Portable-x86_64.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/usr/bin/swqt/swqt
          test -x squashfs-root/usr/bin/swextract
          test -x squashfs-root/usr/bin/hactool
          squashfs-root/usr/bin/swextract --help >/dev/null
          test -s squashfs-root/usr/share/wrapper/ca-bundle.pem
          SSL_CERT_FILE=/dev/null SSL_CERT_DIR=/nonexistent \
          SAVAGEWIND_CA_BUNDLE="$PWD/squashfs-root/usr/share/wrapper/ca-bundle.pem" \
          squashfs-root/usr/bin/swqt/swqt --tls-selftest
          test -f squashfs-root/usr/share/wrapper/build_progress.py
          test -f squashfs-root/usr/share/wrapper/core.py
          test -f squashfs-root/usr/share/wrapper/rollback.py
          test -f squashfs-root/usr/share/wrapper/migration.py
          LD_LIBRARY_PATH="$PWD/squashfs-root/usr/lib" squashfs-root/usr/bin/hactool 2>&1 | head -10 || true
      - name: Save CI build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SavageWind-Portable-x86_64
          path: build/dist/SavageWind-Portable-x86_64.AppImage
          if-no-files-found: error
      - name: Publish immutable versioned release with wrapper changelog
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          asset=build/dist/SavageWind-Portable-x86_64.AppImage
          test -s "$asset"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; refusing to overwrite published assets."
            exit 1
          fi
          sha256sum "$asset" > "$asset.sha256"
          python3 tools/linux/portable_release.py notes --image "$asset" --output build/dist/RELEASE_NOTES.md
          gh release create "$TAG" "$asset" "$asset.sha256" \
            --target "$GITHUB_SHA" \
            --title "Savage Wind Portable ${TAG#portable-}" \
            --notes-file build/dist/RELEASE_NOTES.md \
            --latest
